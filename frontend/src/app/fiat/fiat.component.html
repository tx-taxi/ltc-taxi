<ng-container *ngIf="blockConversion; else livePrice">
 <span [class]="colorClass" *ngIf="blockConversion.price[currency] > 0; else unavailable">{{ blockConversion.price[currency] * value / 100000000 | fiatCurrency : digitsInfo : currency }}</span>
</ng-container>
<ng-template #livePrice>
 <ng-container *ngIf="!forceBlockConversion; else unavailable">
 <ng-container *ngIf="conversions$ | async as conversions; else unavailable">
  <span [class]="colorClass" *ngIf="conversions[currency] > 0; else unavailable">{{ conversions[currency] * value / 100000000 | fiatCurrency : digitsInfo : currency }}</span>
 </ng-container>
 </ng-container>
</ng-template>
<ng-template #unavailable><span title="Fiat price unavailable" i18n-title="@@taxi.ltc.fiat.unavailable">—</span></ng-template>
