<section class="taxi-docs-intro" aria-label="About tx.taxi" i18n-aria-label="@@taxi.intro.label">
  <div class="taxi-docs-art" aria-hidden="true"></div>
  <div class="taxi-docs-copy">
    <p class="taxi-docs-eyebrow">tx.taxi <span aria-hidden="true">/</span> {{ chainName }} {{ contextLabel }}</p>
    <h2 i18n="@@taxi.intro.title">One search across chains.</h2>
    <p i18n="@@taxi.intro.description">Paste a transaction, block or address into tx.taxi. Open a confirmed match, choose between possible networks, or head straight to your chain’s explorer.</p>
    <div class="taxi-docs-actions">
      <a class="taxi-docs-button" href="https://tx.taxi/"><span i18n="@@taxi.intro.open">Open tx.taxi</span> <span aria-hidden="true">↗︎</span></a>
      <a class="taxi-docs-native" [href]="nativeHref" [attr.aria-label]="nativeLabel"><span i18n="@@taxi.intro.native">Explore {{ chainName }}</span>&nbsp;<span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
